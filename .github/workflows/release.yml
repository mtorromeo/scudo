name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  static-x86_64:
    name: Static x86_64 build
    runs-on: ubuntu-latest
    # glibc 2.28: what is linked statically from here runs on RHEL 8, Ubuntu
    # 22.04 and anything newer. See packaging/build-static.sh.
    container: almalinux:8
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          SCUDO_VERSION: ${{ github.ref_name }}
        run: packaging/build-static.sh

      - uses: actions/upload-artifact@v4
        with:
          name: scudo-x86_64-linux
          path: dist/*.tar.xz*

  release:
    name: Publish
    needs: static-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scudo-x86_64-linux
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
