name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  static-x86_64:
    name: Static x86_64 build
    runs-on: ubuntu-latest
    # glibc 2.28: what is linked statically from here runs on RHEL 8, Ubuntu
    # 22.04 and anything newer. See packaging/build-static.sh.
    container: almalinux:8
    steps:
      - uses: actions/checkout@v4

      # The release notes are this section; `cargo make release` writes it
      # before tagging, so a tag pushed without it stops here. A tag from before
      # there was a changelog (v0.1.0) is released without notes.
      - name: Check CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          if [ -f CHANGELOG.md ] && ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version; tag with cargo make release"
            exit 1
          fi

      - name: Build
        env:
          SCUDO_VERSION: ${{ github.ref_name }}
        run: packaging/build-static.sh

      - uses: actions/upload-artifact@v4
        with:
          name: scudo-x86_64-linux
          path: dist/*.tar.xz*

  release:
    name: Publish
    needs: static-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: scudo-x86_64-linux
          path: dist

      # The tag's section of CHANGELOG.md, without its heading: everything
      # from it up to the next release's heading or the link list.
      - name: Extract the release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          touch notes.md
          [ -f CHANGELOG.md ] || exit 0
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md >notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # The documentation describes what main does, which is not what is released
  # until it is tagged; so the site is only rebuilt here, from the tag. The
  # landing page and everything else on gh-pages are left alone.
  docs:
    name: Publish the documentation
    needs: release
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: v0.5.4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Install mdbook
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" mdbook
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Build
        run: mdbook build book

      - name: Push to gh-pages
        run: |
          rsync -a --delete target/book/ site/docs/docs/
          cd site
          git add -A docs/docs
          if git diff --cached --quiet; then
            echo "the documentation is unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "docs: publish the documentation of $GITHUB_REF_NAME"
          git push origin gh-pages
