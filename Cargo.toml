[package]
name = "scudo"
version = "0.2.0"
edition = "2024"
authors = ["Massimiliano Torromeo <massimiliano.torromeo@gmail.com>"]
description = "Run commands sandboxed via systemd-run with per-command resource and permission profiles"
license = "MIT OR Apache-2.0"

# The eBPF crate is a member so that build.rs can name it with `--package`, but
# it is kept out of default-members: it only builds for bpfel-unknown-none.
[workspace]
members = ["ebpf/scudo-bpf-common", "ebpf/scudo-bpf-ebpf"]
default-members = [".", "ebpf/scudo-bpf-common"]

# The workspace release profile is tuned for small host binaries; the eBPF object
# needs the opposite, and its BTF must survive.
[profile.release.package.scudo-bpf-ebpf]
opt-level = 3
debug = 2
codegen-units = 1
overflow-checks = false

[features]
default = ["bpf", "tui"]
# Build scudo-bpfd and the eBPF programs it loads. Turning this off drops the
# rust-src and bpf-linker build requirements; scudo itself still talks
# to the daemon when one is installed.
bpf = ["dep:aya", "dep:aya-build", "dep:scudo-bpf-common"]
# Build the terminal UI behind `--tui`. Turning it off drops ratatui and the
# terminal emulator; the `tui` sub-table in a profile still parses, so a config
# written for a full build is not rejected by a build without it.
tui = ["dep:ratatui", "dep:tui-term", "dep:vt100"]

[[bin]]
name = "scudo-bpfd"
path = "src/bin/scudo-bpfd.rs"
required-features = ["bpf"]

[lints.clippy]
absolute_paths = "allow"
allow_attributes_without_reason = "allow"
arbitrary_source_item_ordering = "allow"
as_conversions = "allow"
big_endian_bytes = "allow"
blanket_clippy_restriction_lints = "allow"
disallowed_script_idents = "allow"
enum_glob_use = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
expect_used = "allow"
expl_impl_clone_on_copy = "allow"
inline_modules = "allow"
inline_trait_bounds = "allow"
implicit_return = "allow"
iter_over_hash_type = "allow"
mem_forget = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_inline_in_public_items = "allow"
missing_panics_doc = "allow"
missing_trait_methods = "allow"
mixed_read_write_in_expression = "allow"
module_name_repetitions = "allow"
partial_pub_fields = "allow"
pattern_type_mismatch = "allow"
pedantic = { level = "warn", priority = -1 }
print_stderr = "allow"
pub_use = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
restriction = { level = "warn", priority = -2 }
rest_pattern_accessible_field = "allow"
self_named_module_files = "allow"
shadow_reuse = "allow"
# core::io is unstable and alloc adds nothing to a std binary.
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
shadow_unrelated = "allow"
single_call_fn = "allow"
single_char_lifetime_names = "allow"
size_of_in_element_count = "allow"
string_slice = "allow"
too_many_lines = "allow"
unseparated_literal_suffix = "allow"

[dependencies]
anyhow = "1"
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
toml = { version = "1", features = ["display", "preserve_order"] }
# Profiles are applied in the order they are written, so the maps keep it.
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
# No env-filter: a level is all that is configurable, and env-filter would pull
# in `matchers` and its own regex engine for directives nothing here accepts.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
tracing-journald = "0.3"
# aya and fuser log through the `log` facade; without this bridge their records
# are dropped on the floor.
tracing-log = "0.2"

aya = { version = "0.14", optional = true }
scudo-bpf-common = { path = "ebpf/scudo-bpf-common", optional = true }

[build-dependencies]
aya-build = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
clap = { version = "4", features = ["derive", "env"] }
fuser = "0.17"
libc = "0.2"

# `ratatui` re-exports the crossterm it was built against, so the backend is
# never named twice and cannot drift out of step with it.
ratatui = { version = "0.30", optional = true, default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }
tui-term = { version = "0.3", optional = true, default-features = false, features = ["vt100"] }
vt100 = { version = "0.16", optional = true }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0
